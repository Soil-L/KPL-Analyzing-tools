name: 功能建议
description: 提议新的分析能力、工作流或性能改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流中的具体困难，不要只描述实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明用户交互、输入、输出和预期效果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如果考虑过其他做法，请说明取舍。
  - type: dropdown
    id: compatibility
    attributes:
      label: 是否影响现有数据格式或统计口径
      options:
        - 不影响
        - 可能影响，需要讨论
        - 会影响，建议升级格式版本
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 如何验证
      description: 建议可量化的准确率、性能或可用性验收方式。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 此建议不要求在仓库中加入未授权视频或真实用户数据。
          required: true
