name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  local-analyzer:
    name: Local analyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-local.txt
      - name: Run backend tests
        run: python -m unittest tests/test_local_app.py
      - name: Check Python syntax
        run: python -m py_compile local_app.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Check local UI syntax
        run: node --check local-ui/app.js

  web-prototype:
    name: Optional web prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm test
